spring:
  application:
    name: gps-distance
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/distance}
    username: ${SPRING_DATASOURCE_USERNAME:distance}
    password: ${SPRING_DATASOURCE_PASSWORD:distance}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

# Domain rule thresholds — see DESIGN.md section 5. All configurable; the active
# rule set is stamped onto every DistanceResult as `ruleVersion` for determinism.
distance:
  rules:
    version: 1
    max-speed-kmh: 120            # teleport filter + routed-speed sanity limit
    min-accuracy-m: 50            # drop fixes less accurate than this
    short-gap-seconds: 70         # below this, a plausible-speed gap is aerial
    parked-speed-kmh: 5           # below this over a long gap, the cab was parked
    office-radius-m: 400          # actual trip-end accepted only within this of office
    routed-max-km: 100            # reject a single routed segment above this
    degraded-multiplier: 1.4      # aerial multiplier when the provider is unavailable
    include-no-show-anchors: true
  cache:
    snap-decimals: 3              # coordinate decimals for the routing-cache cell key
    max-size: 100000              # LRU eviction bound (cap on memory)
    ttl-hours: 168                # entries expire after this (7 days) — bounds staleness
  provider:
    road-factor: 1.3              # fake provider: driving distance = aerial x this
    circuit-failure-threshold: 5  # consecutive failures before the circuit opens
    circuit-open-seconds: 10      # cooldown before a half-open probe
  recovery:
    interval-ms: 30000            # how often to auto-recompute degraded trips after recovery
  auth:
    # Override the secret in production via DISTANCE_AUTH_SECRET; must be >= 32 bytes.
    secret: ${DISTANCE_AUTH_SECRET:local-dev-secret-change-me-0123456789-abcdef}
    token-ttl-minutes: 120
    # Demo users. In production these would come from a real identity provider.
    users:
      - username: operator
        password: operator-pass
        tenant-id: tenantA
        role: OPERATOR
      - username: viewer
        password: viewer-pass
        tenant-id: tenantA
        role: EMPLOYEE
      - username: admin
        password: admin-pass
        tenant-id: tenantA
        role: ADMIN
